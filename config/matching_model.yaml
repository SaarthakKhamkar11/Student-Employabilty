# Which model Stage 4 (predict_suitability) uses: the config flag the Matching Agent reads (docs/adr/0015).
#   active: weighted_baseline_v1   Baseline 3, structured feature matching (config/matching_baseline_v1.yaml)
#   active: <candidate key>        a trained Phase 8 model from models/matching/<artifacts_experiment>/
# Changed only by the selection engine's --activate after a "select" decision on human labels, never by hand.
# The MATCHING_MODEL environment variable overrides `active` for one process (demos, tests); it is never a default.
# A trained model refuses embeddings other than the ones it was trained on, so the choice is per embedding model:
# the top level is for the primary model; `fallback` covers the TF-IDF fallback (docs/adr/0012).
embedding_model: e5_base_v2
# Baseline 3 until the Phase 8 candidates are retrained on E5 features and selected on the human labels.
active: logistic_regression
# The training run whose artifacts (hash-checked manifest) a trained model is loaded from.
artifacts_experiment: mms-20261015T123632Z-nolabels
# The human-label selection run that chose `active`; "none" until one exists.
selection_experiment: mms-20261015T124013Z-human
fallback:
  tfidf_baseline:
    # 2026-10-15, features-v2: the human-label run decided "keep Baseline 3" (Logistic Regression led the candidates,
    # NDCG@10 +0.023 not distinguishable, Overall 0.697 vs Baseline 3's 0.711; docs/adr/0015). --activate writes only
    # "select" decisions, and the previous fallback (logistic_regression, features-v1) can't score features-v2, so
    # the rule's decision is written here by hand.
    active: weighted_baseline_v1
    artifacts_experiment: mms-20261015T124629Z-nolabels
    selection_experiment: mms-20261015T124901Z-human
