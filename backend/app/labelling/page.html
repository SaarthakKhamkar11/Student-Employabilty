<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relevance Labelling</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6675; --line: #dfe3ea;
    --accent: #2457c5; --accent-text: #ffffff; --ok: #1f7a4d; --warn: #a1450f;
    --g0: #8a94a6; --g1: #b0832a; --g2: #2f7fb8; --g3: #1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
      --accent: #6d9bff; --accent-text: #0d1220; --ok: #4fc58c; --warn: #f0a35e;
      --g0: #8a94a6; --g1: #d9a441; --g2: #5aa9e6; --g3: #4fc58c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  .muted { color: var(--muted); }
  .bar { flex: 1 1 200px; min-width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--ok); width: 0; transition: width .3s; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px; }
  details.rubric { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  details.rubric summary { cursor: pointer; font-weight: 600; }
  .grid { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .student { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
  @media (max-width: 820px) { .student { position: static; max-height: none; } }
  .field { margin: 0 0 10px; }
  .field b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .field p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .job { margin-bottom: 12px; border-left: 4px solid var(--line); }
  .job.graded { border-left-color: var(--ok); }
  .job h3 { margin: 0 0 6px; font-size: 16px; }
  .job .field p { font-size: 14px; }
  .grades { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .grades button { flex: 1 1 120px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
                   background: var(--bg); color: var(--text); cursor: pointer; font: inherit; text-align: left; }
  .grades button small { display: block; color: var(--muted); font-size: 12px; }
  .grades button[aria-pressed="true"] { color: #fff; border-color: transparent; }
  .grades button[aria-pressed="true"] small { color: rgba(255,255,255,.85); }
  .grades button[data-g="0"][aria-pressed="true"] { background: var(--g0); }
  .grades button[data-g="1"][aria-pressed="true"] { background: var(--g1); }
  .grades button[data-g="2"][aria-pressed="true"] { background: var(--g2); }
  .grades button[data-g="3"][aria-pressed="true"] { background: var(--g3); }
  .grades button:focus-visible, .primary:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; padding: 9px 16px;
             font: inherit; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  input { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
          color: var(--text); width: 110px; text-transform: uppercase; }
  .footer { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 8px; }
  .msg { padding: 10px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 16px; }
  .msg.err { border-color: var(--warn); color: var(--warn); }
  ul { margin: 6px 0 0 18px; padding: 0; }
</style>
</head>
<body>
<header>
  <h1>Relevance labelling</h1>
  <span class="muted" id="pool"></span>
  <div class="bar" title="students with at least one complete set of grades"><div id="progress"></div></div>
  <span id="progress-text" class="muted"></span>
  <form id="who" style="display:flex;gap:8px;align-items:center">
    <label for="initials" class="muted">Your initials</label>
    <input id="initials" maxlength="8" autocomplete="off" required pattern="[A-Za-z]{2,8}">
    <button class="primary" type="submit">Start</button>
  </form>
</header>
<main>
  <div id="message" class="msg" hidden></div>
  <details class="rubric" id="rubric" open><summary>How to grade</summary><div id="rubric-body"></div></details>
  <div class="grid" id="work" hidden>
    <section class="card student" aria-label="Student profile"><h2 style="margin-top:0;font-size:16px" id="student-title"></h2><div id="student"></div></section>
    <section aria-label="Jobs to grade">
      <div id="jobs"></div>
      <div class="footer"><span id="count" class="muted"></span><button class="primary" id="next" disabled>Next student</button></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get() { try { return localStorage.getItem("labeller") || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem("labeller", v); } catch { /* private mode: keep it in memory only */ } },
};
const fromUrl = new URLSearchParams(location.search).get("labeller") || "";
let labeller = /^[A-Za-z]{2,8}$/.test(fromUrl) ? fromUrl.toUpperCase() : store.get();
let current = null;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v; else node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.append(c);
  return node;
}

async function api(path, options = {}) {
  const resp = await fetch(path, options);
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.detail || resp.statusText);
  return body;
}

function message(text, isError = false) {
  const box = $("message");
  box.hidden = !text;
  box.textContent = text || "";
  box.className = "msg" + (isError ? " err" : "");
}

function renderRubric(r) {
  const body = $("rubric-body");
  body.replaceChildren(
    el("p", { text: r.question }),
    el("ul", {}, ...Object.entries(r.grades).sort((a, b) => b[0] - a[0])
      .map(([g, x]) => el("li", {}, el("b", { text: `${g} ${x.name}: ` }), x.meaning))),
    el("p", { text: "Ignore:" }),
    el("ul", {}, ...r.ignore.map((t) => el("li", { text: t }))),
  );
}

async function loadStatus() {
  const s = await api(`/labelling/api/status?labeller=${encodeURIComponent(labeller)}`);
  if (!s.pool_version) { message(s.message, true); return; }
  $("pool").textContent = s.pool_version;
  renderRubric(s.rubric);
  const done = s.students_with_one_complete_judgment;
  $("progress").style.width = `${Math.round(100 * done / s.students_total)}%`;
  $("progress-text").textContent = `${done} / ${s.students_total} students graded` +
    (s.you ? ` · you: ${s.you.judgments} grades` : "");
  if (!s.you) return;
  if (!s.you.next_student) {
    $("work").hidden = true;
    message("Nothing left for you to grade. Thank you! The export is at /labelling/api/export.csv");
    return;
  }
  await loadStudent(s.you.next_student);
}

async function loadStudent(studentId) {
  current = await api(`/labelling/api/students/${encodeURIComponent(studentId)}?labeller=${encodeURIComponent(labeller)}`);
  message("");
  $("work").hidden = false;
  $("student-title").textContent = `Student ${current.student_id}`;
  $("student").replaceChildren(...current.student.map((f) =>
    el("div", { class: "field" }, el("b", { text: f.label }), el("p", { text: f.text }))));
  $("jobs").replaceChildren(...current.jobs.map(renderJob));
  updateCount();
  window.scrollTo({ top: 0 });
  $("rubric").open = false;
}

function renderJob(job) {
  const card = el("article", { class: "card job" + (job.your_label !== null ? " graded" : "") });
  const buttons = el("div", { class: "grades", role: "group", "aria-label": `Grade for ${job.job_title}` });
  for (const [g, name] of [[0, "Irrelevant"], [1, "Weak"], [2, "Moderate"], [3, "Strong"]]) {
    const b = el("button", { type: "button", "data-g": String(g), "aria-pressed": String(job.your_label === g) },
                 `${g}`, el("small", { text: name }));
    b.addEventListener("click", () => grade(job, g, card, buttons));
    buttons.append(b);
  }
  const title = [job.job_title, job.role].filter((t, i, a) => t && a.indexOf(t) === i).join(" — ");
  card.append(
    el("h3", { text: title }),
    ...[["Skills", job.skills], ["Description", job.job_description], ["Responsibilities", job.responsibilities]]
      .filter(([, t]) => t).map(([k, t]) => el("div", { class: "field" }, el("b", { text: k }), el("p", { text: t }))),
    buttons,
  );
  return card;
}

async function grade(job, g, card, buttons) {
  try {
    await api("/labelling/api/judgments", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ student_id: current.student_id, job_id: job.job_id, labeller, relevance_label: g }),
    });
    job.your_label = g;
    for (const b of buttons.children) b.setAttribute("aria-pressed", String(Number(b.dataset.g) === g));
    card.classList.add("graded");
    updateCount();
  } catch (e) {
    message(`Not saved: ${e.message}`, true);
  }
}

function updateCount() {
  const graded = current.jobs.filter((j) => j.your_label !== null).length;
  $("count").textContent = `${graded} / ${current.jobs.length} jobs graded for this student`;
  $("next").disabled = graded < current.jobs.length;
}

$("next").addEventListener("click", () => loadStatus().catch((e) => message(e.message, true)));
$("who").addEventListener("submit", (event) => {
  event.preventDefault();
  labeller = $("initials").value.trim().toUpperCase();
  store.set(labeller);
  loadStatus().catch((e) => message(e.message, true));
});

$("initials").value = labeller;
(labeller ? loadStatus() : api("/labelling/api/status").then((s) => {
  if (s.rubric) renderRubric(s.rubric);
  if (s.pool_version) $("pool").textContent = s.pool_version;
  message("Enter your initials to start. Your grades are saved as you click.");
})).catch((e) => message(e.message, true));
</script>
</body>
</html>
